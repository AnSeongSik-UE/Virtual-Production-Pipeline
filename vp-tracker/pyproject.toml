[project]
name = "vp-tracker"
version = "0.1.0"
description = "MediaPipe-to-Unreal real-time face, head, and upper-arm tracking pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cv2-enumerate-cameras==1.3.3",
    "mcp[cli]>=1.27.0",
    "mediapipe>=0.10.33",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
